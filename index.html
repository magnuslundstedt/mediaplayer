<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>mediaplayer</title>
  <style>
    :root {
      --bg: #111315;
      --fg: #f2f2f0;
      --muted: #9aa0a6;
      --accent: #7cc4ff;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #fafaf8;
        --fg: #16181a;
        --muted: #5c6268;
        --accent: #0b63b0;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--fg);
      font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { max-width: 28rem; }
    h1 { margin: 0 0 8px; font-size: 1.75rem; }
    p { margin: 0 0 16px; }
    .muted { color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>mediaplayer</h1>
    <p>A player for practising one section of a track on repeat: load your own
      audio file, mark a loop, slow it down.</p>
    <p class="muted">Not built yet. This page is a placeholder.</p>
    <p><a href="https://github.com/magnuslundstedt/mediaplayer/blob/main/plan.md">Read the plan</a></p>
  </main>
</body>
</html>
